              type: integer
            in_review:
              type: integer
            done:
              type: integer
            cancelled:
              type: integer
        upcoming:
          type: object
          description: Tasks due within the next 7 days (list representation).
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TaskListItem'
        overdue_count:
          type: integer
