          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
      required: [projects, tasks, comments]

    RegisterRequest:
      type: object
      description: Payload for registering a new user.
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 255
      required: [name, email, password]

    LoginRequest:
      type: object
      description: Payload for logging in.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
      required: [email, password]

    UpdateProfileRequest:
      type: object
      description: Payload for updating the authenticated user's profile.
      properties:
        name:
          type: string
          maxLength: 255
        avatar_url:
          type: string
          maxLength: 2048
          nullable: true
        timezone:
          type: string
          maxLength: 64

    ChangePasswordRequest:
      type: object
      description: Payload for changing the authenticated user's password.
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 255
          description: Must differ from the current password.
      required: [current_password, new_password]

    UpdateUserRequest:
      type: object
      description: Payload for administratively updating a user.
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        role:
          type: string
          enum: [admin, member]
        avatar_url:
          type: string
          maxLength: 2048
          nullable: true
        timezone:
          type: string
          maxLength: 64

    StoreTeamRequest:
      type: object
      description: Payload for creating a team.
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: string
          nullable: true
      required: [name, slug]

    UpdateTeamRequest:
      type: object
      description: Payload for updating a team.
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: string
          nullable: true

    InviteTeamMemberRequest:
      type: object
      description: Payload for inviting a team member by email.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        role:
          type: string
          enum: [owner, admin, member]
      required: [email, role]

    UpdateTeamMemberRequest:
      type: object
      description: Payload for updating a team member's role.
      properties:
        role:
          type: string
          enum: [owner, admin, member]
      required: [role]

    StoreProjectRequest:
      type: object
      description: Payload for creating a project.
      properties:
        name:
          type: string
          maxLength: 255
        key:
          type: string
          maxLength: 16
          pattern: '^[A-Z0-9]+$'
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        color:
          type: string
          maxLength: 32
          nullable: true
      required: [name, key]

    UpdateProjectRequest:
      type: object
      description: Payload for updating a project.
      properties:
        name:
          type: string
          maxLength: 255
        key:
          type: string
          maxLength: 16
          pattern: '^[A-Z0-9]+$'
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        color:
          type: string
          maxLength: 32
          nullable: true

    StoreProjectMemberRequest:
      type: object
      description: Payload for adding a project member.
      properties:
        user_id:
          type: integer
        role:
          type: string
          enum: [lead, contributor, viewer]
      required: [user_id, role]

    UpdateProjectMemberRequest:
      type: object
      description: Payload for updating a project member's role.
      properties:
        role:
          type: string
          enum: [lead, contributor, viewer]
      required: [role]

    StoreLabelRequest:
      type: object
      description: Payload for creating a label.
      properties:
        name:
          type: string
          maxLength: 64
        color:
          type: string
          maxLength: 32
          pattern: '^#?[0-9a-fA-F]{3,8}$'
      required: [name, color]

    UpdateLabelRequest:
      type: object
      description: Payload for updating a label.
      properties:
        name:
          type: string
          maxLength: 64
        color:
          type: string
          maxLength: 32
          pattern: '^#?[0-9a-fA-F]{3,8}$'

    StoreTaskRequest:
      type: object
      description: Payload for creating a task or subtask.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignee_id:
          type: integer
          nullable: true
        parent_id:
          type: integer
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true
        position:
          type: integer
          minimum: 0
        label_ids:
          type: array
          items:
            type: integer
      required: [title]

    UpdateTaskRequest:
      type: object
      description: Payload for updating a task.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignee_id:
          type: integer
          nullable: true
        parent_id:
          type: integer
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true
        position:
          type: integer
          minimum: 0

    AssignTaskRequest:
      type: object
      description: Payload for assigning a task to a user.
      properties:
        user_id:
          type: integer
      required: [user_id]

    TransitionStatusRequest:
      type: object
      description: Payload for transitioning a task's status.
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'
      required: [status]

    UpdatePriorityRequest:
      type: object
      description: Payload for updating a task's priority.
      properties:
        priority:
          $ref: '#/components/schemas/TaskPriority'
      required: [priority]

    SyncLabelsRequest:
      type: object
      description: Payload for replacing a task's label set.
      properties:
        label_ids:
          type: array
          items:
            type: integer
      required: [label_ids]

    ReorderTaskRequest:
      type: object
      description: Payload for reordering a task.
      properties:
        position:
          type: integer
          minimum: 0
      required: [position]

    StoreCommentRequest:
      type: object
      description: Payload for creating a comment.
      properties:
        body:
          type: string
          maxLength: 10000
      required: [body]

    UpdateCommentRequest:
      type: object
      description: Payload for updating a comment.
      properties:
        body:
          type: string
          maxLength: 10000

    StoreAttachmentRequest:
      type: object
      description: Multipart payload for uploading an attachment (max 20 MB).
      properties:
        file:
          type: string
          format: binary
      required: [file]
