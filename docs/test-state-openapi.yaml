    RegisterRequest:
      type: object
      description: Payload for registering a new user.
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 255
    LoginRequest:
      type: object
      description: Payload for logging in.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
    UpdateProfileRequest:
      type: object
      description: Payload for updating the authenticated user's profile.
      properties:
        name:
          type: string
          maxLength: 255
        avatar_url:
          type: [string, "null"]
          maxLength: 2048
        timezone:
          type: string
          maxLength: 64
    ChangePasswordRequest:
      type: object
      description: Payload for changing the authenticated user's password.
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 255
          description: Must differ from the current password.
    UpdateUserRequest:
      type: object
      description: Payload for an admin to update a user. Exact fields are defined by the server-side validator.
      additionalProperties: true
    StoreTeamRequest:
      type: object
      description: Payload for creating a team.
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: [string, "null"]
    UpdateTeamRequest:
      type: object
      description: Payload for updating a team. Exact fields are defined by the server-side validator.
      additionalProperties: true
    InviteMemberRequest:
      type: object
      description: Payload for inviting a member to a team.
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        role:
          $ref: '#/components/schemas/TeamRole'
    UpdateTeamMemberRequest:
      type: object
      description: Payload for updating a team member's role.
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/TeamRole'
    StoreProjectRequest:
      type: object
      description: Payload for creating a project.
      required: [name, key]
      properties:
        name:
          type: string
          maxLength: 255
        key:
          type: string
          maxLength: 16
          pattern: '^[A-Z0-9]+$'
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [active, archived]
        color:
          type: [string, "null"]
          maxLength: 32
    UpdateProjectRequest:
      type: object
      description: Payload for updating a project. Exact fields are defined by the server-side validator.
      additionalProperties: true
    StoreProjectMemberRequest:
      type: object
      description: Payload for adding a project member.
      required: [user_id, role]
      properties:
        user_id:
          type: integer
        role:
          $ref: '#/components/schemas/ProjectRole'
    UpdateProjectMemberRequest:
      type: object
      description: Payload for updating a project member's role.
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
    StoreLabelRequest:
      type: object
      description: Payload for creating a label.
      required: [name, color]
      properties:
        name:
          type: string
          maxLength: 64
        color:
          type: string
          maxLength: 32
          pattern: '^#?[0-9a-fA-F]{3,8}$'
    UpdateLabelRequest:
      type: object
      description: Payload for updating a label. Exact fields are defined by the server-side validator.
      additionalProperties: true
    StoreTaskRequest:
      type: object
      description: Payload for creating a task or subtask.
      required: [title]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: [string, "null"]
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignee_id:
          type: [integer, "null"]
        parent_id:
          type: [integer, "null"]
        due_date:
          type: [string, "null"]
          format: date
        position:
          type: integer
          minimum: 0
        label_ids:
          type: array
          items:
            type: integer
    UpdateTaskRequest:
      type: object
      description: Payload for updating a task. Exact fields are defined by the server-side validator.
      additionalProperties: true
    AssignTaskRequest:
      type: object
      description: Payload for assigning a task to a user.
      required: [user_id]
      properties:
        user_id:
          type: integer
    TransitionStatusRequest:
      type: object
      description: Payload for transitioning a task's status.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'
    UpdatePriorityRequest:
      type: object
      description: Payload for updating a task's priority.
      required: [priority]
      properties:
        priority:
          $ref: '#/components/schemas/TaskPriority'
    SyncLabelsRequest:
      type: object
      description: Payload for replacing a task's label set.
      required: [label_ids]
      properties:
        label_ids:
          type: array
          items:
            type: integer
    ReorderTaskRequest:
      type: object
      description: Payload for reordering a task among its siblings.
      required: [position]
      properties:
        position:
          type: integer
          minimum: 0
    StoreCommentRequest:
      type: object
      description: Payload for posting a comment.
      required: [body]
      properties:
        body:
          type: string
          maxLength: 10000
    UpdateCommentRequest:
      type: object
      description: Payload for editing a comment.
      required: [body]
      properties:
        body:
          type: string
          maxLength: 10000
    StoreAttachmentRequest:
      type: object
      description: Multipart payload for uploading an attachment.
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The file to upload (max 20 MB).
security:
  - bearerToken: []
