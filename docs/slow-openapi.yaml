      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated task activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/{task}/comments:
    parameters:
