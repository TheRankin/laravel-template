components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        API token issued at registration/login, sent as a Bearer token in the
        Authorization header.
  parameters:
    PerPage:
      name: per_page
      in: query
      description: Number of items per page (1-100, default 20).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: user
      in: path
      required: true
      schema:
        type: integer
    TeamId:
      name: team
      in: path
      required: true
      schema:
        type: integer
    ProjectId:
      name: project
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: task
      in: path
      required: true
      schema:
        type: integer
    LabelId:
      name: label
      in: path
      required: true
      schema:
        type: integer
    CommentId:
      name: comment
      in: path
      required: true
      schema:
        type: integer
    AttachmentId:
      name: attachment
      in: path
      required: true
      schema:
        type: integer
    NotificationId:
      name: notification
      in: path
      required: true
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Authentication is required or the token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    UserResponse:
      description: A single user resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserWrapper'
    TeamResponse:
      description: A single team resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamWrapper'
    TeamMemberResponse:
      description: A single team member resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamMemberWrapper'
    ProjectResponse:
      description: A single project resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectWrapper'
    ProjectMemberResponse:
      description: A single project member resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectMemberWrapper'
    LabelResponse:
      description: A single label resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LabelWrapper'
    TaskResponse:
      description: A single task resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskWrapper'
    CommentResponse:
      description: A single comment resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommentWrapper'
    AttachmentResponse:
      description: A single attachment resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttachmentWrapper'
  schemas:
    MessageResponse:
      type: object
      description: A generic message payload used for error responses.
      properties:
        message:
          type: string
    ValidationErrorResponse:
      type: object
      description: Laravel validation error payload.
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PaginationLinks:
      type: object
      description: Pagination links returned by Laravel paginated resources.
      properties:
        first:
          type: [string, 'null']
        last:
          type: [string, 'null']
        prev:
          type: [string, 'null']
        next:
          type: [string, 'null']
    PaginationMeta:
      type: object
      description: Pagination metadata returned by Laravel paginated resources.
      properties:
        current_page:
          type: integer
        from:
          type: [integer, 'null']
        last_page:
          type: integer
        path:
          type: string
        per_page:
          type: integer
        to:
          type: [integer, 'null']
        total:
          type: integer
    TaskStatus:
      type: string
      enum: [todo, in_progress, in_review, done, cancelled]
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]
    User:
      type: object
      description: A user account. The email is only visible to the user themselves or admins.
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        avatar_url:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
        created_at:
          type: [string, 'null']
          format: date-time
    UserWrapper:
