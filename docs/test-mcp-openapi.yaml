          type: integer
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLog'

    SearchResults:
      type: object
      description: Global search results grouped by resource type.
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 255
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
    UpdateProfileRequest:
      type: object
      description: Partial profile update. All fields optional.
      properties:
        name:
          type: string
          maxLength: 255
        avatar_url:
          type: string
          maxLength: 2048
          nullable: true
        timezone:
          type: string
          maxLength: 64
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 255
          description: Must differ from current_password.
    UpdateUserRequest:
      type: object
      description: Admin update of a user. All fields optional.
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        role:
          type: string
          enum: [admin, member]
        avatar_url:
          type: string
          maxLength: 2048
          nullable: true
        timezone:
          type: string
          maxLength: 64

    StoreTeamRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          description: Lowercase alphanumeric with hyphen separators.
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: string
          nullable: true
    UpdateTeamRequest:
      type: object
      description: Partial team update. All fields optional.
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: string
          nullable: true
    InviteTeamMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        role:
          $ref: '#/components/schemas/TeamRole'
    UpdateTeamMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/TeamRole'

    StoreProjectRequest:
      type: object
      required: [name, key]
      properties:
        name:
          type: string
          maxLength: 255
        key:
          type: string
          maxLength: 16
          description: Uppercase alphanumeric project key (unique within team).
          pattern: '^[A-Z0-9]+$'
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        color:
          type: string
          maxLength: 32
          nullable: true
    UpdateProjectRequest:
      type: object
      description: Partial project update. All fields optional.
      properties:
        name:
          type: string
          maxLength: 255
        key:
          type: string
          maxLength: 16
          pattern: '^[A-Z0-9]+$'
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        color:
          type: string
          maxLength: 32
          nullable: true
    StoreProjectMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: integer
        role:
          $ref: '#/components/schemas/ProjectRole'
    UpdateProjectMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'

    StoreLabelRequest:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          maxLength: 64
        color:
          type: string
          maxLength: 32
          description: Hex color code.
          pattern: '^#?[0-9a-fA-F]{3,8}$'
    UpdateLabelRequest:
      type: object
      description: Partial label update. All fields optional.
      properties:
        name:
          type: string
          maxLength: 64
        color:
          type: string
          maxLength: 32
          pattern: '^#?[0-9a-fA-F]{3,8}$'

    StoreTaskRequest:
