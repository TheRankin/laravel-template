  /search:
    get:
      tags: [Search]
      summary: Search projects, tasks, and comments
      parameters:
        - name: q
          in: query
          required: true
          description: Search term (2-255 characters).
          schema:
            type: string
            minLength: 2
            maxLength: 255
      responses:
        '200':
          description: Search results.
          content:
