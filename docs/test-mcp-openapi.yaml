        id:
          type: integer
        team_id:
          type: [integer, "null"]
        user_id:
          type: [integer, "null"]
        role:
          $ref: '#/components/schemas/TeamRole'
        user:
          $ref: '#/components/schemas/User'
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    Project:
      type: object
      description: A project belonging to a team.
      properties:
        id:
          type: integer
        team_id:
          type: integer
        name:
          type: string
        key:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [active, archived]
        color:
          type: [string, "null"]
        created_by:
          type: [integer, "null"]
        team:
          $ref: '#/components/schemas/Team'
        creator:
          $ref: '#/components/schemas/User'
        members_count:
          type: integer
        tasks_count:
          type: integer
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    ProjectMember:
