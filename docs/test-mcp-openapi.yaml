      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderTaskRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{task}/activity:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: List task activity
      operationId: listTaskActivity
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated activity log for the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tasks/{task}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      summary: List task comments
      operationId: listComments
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of comments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Comments]
      summary: Create a comment
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCommentRequest'
      responses:
        '201':
          $ref: '#/components/responses/CommentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /comments/{comment}:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags: [Comments]
      summary: Update a comment
      operationId: updateComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Comments]
      summary: Delete a comment
      operationId: deleteComment
      responses:
        '204':
          description: Comment deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task}/attachments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Attachments]
      summary: List task attachments
      operationId: listAttachments
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Attachments]
      summary: Upload an attachment
      operationId: createAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreAttachmentRequest'
      responses:
        '201':
          $ref: '#/components/responses/AttachmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /attachments/{attachment}/download:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      summary: Download an attachment
      description: Streams the stored file as a download.
      operationId: downloadAttachment
      responses:
        '200':
          description: The attachment file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /attachments/{attachment}:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    delete:
      tags: [Attachments]
      summary: Delete an attachment
      operationId: deleteAttachment
      responses:
        '204':
          description: Attachment deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: unread
          in: query
          description: When true, only returns unread notifications.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated list of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: Number of notifications updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notification}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      operationId: markNotificationRead
      responses:
        '200':
          description: The updated notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Notifications]
      summary: Delete a notification
      operationId: deleteNotification
      responses:
        '204':
          description: Notification deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /activity:
    get:
      tags: [Activity]
      summary: List global activity
      description: >-
        Returns activity visible to the authenticated user (their teams and
        projects, plus global entries). Admins see everything.
      operationId: listActivity
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: team_id
          in: query
          required: false
          schema:
            type: integer
        - name: project_id
          in: query
          required: false
          schema:
            type: integer
        - name: causer_id
          in: query
          required: false
          schema:
            type: integer
        - name: action
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated activity log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard aggregation
      description: >-
        Returns the authenticated user's task counts by status, upcoming tasks,
        overdue count and recent activity.
      operationId: getDashboard
      responses:
        '200':
          description: Dashboard payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search:
    get:
      tags: [Search]
      summary: Global search
      description: Searches projects, tasks and comments visible to the user.
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (2-255 characters).
          schema:
            type: string
            minLength: 2
            maxLength: 255
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        API token issued at registration/login. Send it in the
        Authorization header as a bearer token.
  security: []
  parameters:
    PerPage:
      name: per_page
      in: query
      description: Number of items per page (1-100, default 20).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: user
      in: path
      required: true
      description: User ID.
      schema:
        type: integer
    TeamId:
      name: team
      in: path
      required: true
      description: Team ID.
      schema:
        type: integer
    ProjectId:
      name: project
      in: path
      required: true
      description: Project ID.
      schema:
        type: integer
    LabelId:
      name: label
      in: path
      required: true
      description: Label ID.
      schema:
        type: integer
    TaskId:
      name: task
      in: path
      required: true
      description: Task ID.
      schema:
        type: integer
    CommentId:
      name: comment
      in: path
      required: true
      description: Comment ID.
      schema:
        type: integer
    AttachmentId:
      name: attachment
      in: path
      required: true
      description: Attachment ID.
      schema:
        type: integer
    NotificationId:
      name: notification
      in: path
      required: true
      description: Notification ID.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Authentication is required or the token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    UserResponse:
      description: A single user resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserEnvelope'
    TeamResponse:
      description: A single team resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamEnvelope'
    TeamMemberResponse:
      description: A single team member resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamMemberEnvelope'
    ProjectResponse:
      description: A single project resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectEnvelope'
    ProjectMemberResponse:
      description: A single project member resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectMemberEnvelope'
    LabelResponse:
      description: A single label resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LabelEnvelope'
    TaskResponse:
      description: A single task resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskEnvelope'
    CommentResponse:
      description: A single comment resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommentEnvelope'
    AttachmentResponse:
      description: A single attachment resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttachmentEnvelope'
  schemas:
    MessageResponse:
      type: object
      description: Generic message payload used for errors.
      properties:
        message:
          type: string
      required: [message]
    ValidationError:
      type: object
      description: Laravel validation error response.
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [message, errors]
    PaginationLinks:
      type: object
      description: Pagination navigation links.
      properties:
        first:
          type: [string, 'null']
        last:
          type: [string, 'null']
        prev:
          type: [string, 'null']
        next:
          type: [string, 'null']
    PaginationMeta:
      type: object
      description: Pagination metadata.
      properties:
        current_page:
          type: integer
        from:
          type: [integer, 'null']
        last_page:
          type: integer
        path:
          type: string
        per_page:
          type: integer
        to:
          type: [integer, 'null']
        total:
          type: integer
    HealthStatus:
      type: object
      description: Health check payload.
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        app_version:
          type: string
        php_version:
          type: string
        environment:
          type: string
        debug:
          type: boolean
    TaskStatus:
      type: string
      description: Task workflow status.
      enum: [todo, in_progress, in_review, done, cancelled]
    TaskPriority:
      type: string
      description: Task priority level.
      enum: [low, medium, high, urgent]
    User:
      type: object
      description: A user account. The `email` field is only present for the authenticated user themselves or for admins.
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
        avatar_url:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
        created_at:
          type: [string, 'null']
          format: date-time
      required: [id, name, role]
    Team:
      type: object
      description: A team.
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        owner_id:
          type: integer
        owner:
          $ref: '#/components/schemas/User'
        members_count:
          type: integer
        projects_count:
          type: integer
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [id, name, slug, owner_id]
    TeamMember:
      type: object
      description: A team membership entry.
      properties:
        id:
          type: integer
        team_id:
          type: [integer, 'null']
        user_id:
          type: [integer, 'null']
        role:
          type: [string, 'null']
          enum: [owner, admin, member, null]
        user:
          $ref: '#/components/schemas/User'
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    Project:
      type: object
      description: A project belonging to a team.
      properties:
        id:
          type: integer
        team_id:
          type: integer
        name:
          type: string
        key:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, archived]
        color:
          type: [string, 'null']
        created_by:
          type: [integer, 'null']
        team:
          $ref: '#/components/schemas/Team'
        creator:
          $ref: '#/components/schemas/User'
        members_count:
          type: integer
        tasks_count:
          type: integer
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [id, team_id, name, key, status]
    ProjectMember:
      type: object
      description: A project membership entry.
      properties:
        id:
          type: integer
        project_id:
          type: [integer, 'null']
        user_id:
          type: [integer, 'null']
        role:
          type: [string, 'null']
          enum: [lead, contributor, viewer, null]
        user:
          $ref: '#/components/schemas/User'
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    ProjectStats:
      type: object
      description: Aggregated project statistics. Freeform keys computed by the service. TODO refine.
      additionalProperties: true
    Label:
      type: object
      description: A project label.
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        color:
          type: string
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [id, project_id, name, color]
    Task:
      type: object
      description: A task or subtask. Full representation including description.
      properties:
        id:
          type: integer
        project_id:
          type: integer
        parent_id:
          type: [integer, 'null']
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignee_id:
          type: [integer, 'null']
        reporter_id:
          type: [integer, 'null']
        assignee:
          $ref: '#/components/schemas/User'
        reporter:
          $ref: '#/components/schemas/User'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        due_date:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        position:
          type: integer
        is_overdue:
          type: boolean
        comments_count:
          type: integer
        attachments_count:
          type: integer
        subtasks_count:
          type: integer
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [id, project_id, title, status, priority, position, is_overdue]
    TaskListItem:
      type: object
      description: Lightweight task representation used in list endpoints (omits description).
      properties:
        id:
          type: integer
        project_id:
          type: integer
        parent_id:
          type: [integer, 'null']
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignee_id:
          type: [integer, 'null']
        reporter_id:
          type: [integer, 'null']
        assignee:
          $ref: '#/components/schemas/User'
        reporter:
          $ref: '#/components/schemas/User'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        due_date:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        position:
          type: integer
        is_overdue:
          type: boolean
        comments_count:
          type: integer
        attachments_count:
          type: integer
        subtasks_count:
          type: integer
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [id, project_id, title, status, priority, position, is_overdue]
    Comment:
      type: object
      description: A comment on a task.
      properties:
        id:
          type: integer
        task_id:
          type: integer
        user_id:
          type: integer
        user:
          $ref: '#/components/schemas/User'
        body:
          type: string
        edited_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [id, task_id, user_id, body]
    Attachment:
      type: object
      description: A file attached to a task.
      properties:
        id:
          type: integer
        task_id:
          type: integer
        original_name:
          type: string
        mime:
          type: string
        size:
          type: integer
        uploaded_by:
          type: [integer, 'null']
        uploader:
          $ref: '#/components/schemas/User'
        download_url:
          type: string
          format: uri
        created_at:
          type: [string, 'null']
          format: date-time
      required: [id, task_id, original_name, mime, size, download_url]
    ActivityLog:
      type: object
      description: An activity log entry.
      properties:
        id:
          type: integer
        action:
          type: string
