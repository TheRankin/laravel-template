openapi: 3.1.0
info:
  title: Task Management API
  version: 1.0.0
  description: >-
    HTTP API for a team-based project and task management application built
    with Laravel. Supports teams, projects, tasks (with subtasks, labels,
    comments, attachments), activity logs, notifications, search and a personal
    dashboard. Authentication uses a bearer API token issued at register/login.
servers:
  - url: /api
    description: API base path
tags:
  - name: Auth
    description: Authentication and profile management
  - name: Users
    description: User directory and administration
  - name: Teams
    description: Team management
  - name: Team Members
    description: Team membership management
  - name: Projects
    description: Project management
  - name: Project Members
    description: Project membership management
  - name: Labels
    description: Project label management
  - name: Tasks
    description: Task and subtask management
  - name: Comments
    description: Task comments
  - name: Attachments
    description: Task file attachments
  - name: Notifications
    description: User notifications
  - name: Activity
    description: Activity log feeds
  - name: Dashboard
    description: Personal dashboard
  - name: Search
    description: Global search
  - name: System
    description: Service health
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      summary: Service health check
      description: Public endpoint returning service status and environment metadata.
      security: []
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Register'
      responses:
        '201':
          description: User created and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain an API token
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current API token
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/profile:
    patch:
      tags: [Auth]
      summary: Update the authenticated user profile
      requestBody:
        $ref: '#/components/requestBodies/UpdateProfile'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password:
    post:
      tags: [Auth]
      summary: Change the authenticated user password
      requestBody:
        $ref: '#/components/requestBodies/ChangePassword'
      responses:
        '204':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{user}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update a user (admin only)
      requestBody:
        $ref: '#/components/requestBodies/UpdateUser'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Delete a user (admin only)
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /teams:
    get:
      tags: [Teams]
      summary: List teams the authenticated user belongs to
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Teams]
      summary: Create a team
      requestBody:
        $ref: '#/components/requestBodies/StoreTeam'
      responses:
        '201':
          $ref: '#/components/responses/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teams/{team}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: Get a team
      responses:
        '200':
          $ref: '#/components/responses/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Teams]
      summary: Update a team
      requestBody:
        $ref: '#/components/requestBodies/UpdateTeam'
      responses:
        '200':
          $ref: '#/components/responses/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Teams]
      summary: Delete a team
      responses:
        '204':
          description: Team deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /teams/{team}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Team Members]
      summary: List team members
      responses:
        '200':
          description: List of team members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Team Members]
      summary: Invite a member to the team
      requestBody:
        $ref: '#/components/requestBodies/InviteTeamMember'
      responses:
        '201':
          $ref: '#/components/responses/TeamMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teams/{team}/members/{user}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Team Members]
      summary: Update a team member role
      requestBody:
        $ref: '#/components/requestBodies/UpdateTeamMember'
      responses:
        '200':
          $ref: '#/components/responses/TeamMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Team Members]
      summary: Remove a member from the team
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /teams/{team}/projects:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Projects]
      summary: List projects within a team
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Projects]
      summary: Create a project within a team
      requestBody:
        $ref: '#/components/requestBodies/StoreProject'
      responses:
        '201':
          $ref: '#/components/responses/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{project}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get a project
      responses:
        '200':
          $ref: '#/components/responses/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Update a project
      requestBody:
        $ref: '#/components/requestBodies/UpdateProject'
      responses:
        '200':
          $ref: '#/components/responses/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Projects]
      summary: Delete a project
      responses:
        '204':
          description: Project deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      summary: Archive a project
      responses:
        '200':
          $ref: '#/components/responses/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      summary: Restore an archived project
      responses:
        '200':
          $ref: '#/components/responses/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project}/stats:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get project statistics
      responses:
        '200':
          description: Project statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Project Members]
      summary: List project members
      responses:
        '200':
          description: List of project members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Project Members]
      summary: Add a member to the project
      requestBody:
        $ref: '#/components/requestBodies/StoreProjectMember'
      responses:
        '201':
          $ref: '#/components/responses/ProjectMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{project}/members/{user}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Project Members]
      summary: Update a project member role
      requestBody:
        $ref: '#/components/requestBodies/UpdateProjectMember'
      responses:
        '200':
          $ref: '#/components/responses/ProjectMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Project Members]
      summary: Remove a member from the project
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Activity]
      summary: List activity for a project
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated activity log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project}/labels:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Labels]
      summary: List project labels
      responses:
        '200':
          description: List of labels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Labels]
      summary: Create a label in a project
      requestBody:
        $ref: '#/components/requestBodies/StoreLabel'
      responses:
        '201':
          $ref: '#/components/responses/LabelResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /labels/{label}:
    parameters:
      - $ref: '#/components/parameters/LabelId'
    patch:
      tags: [Labels]
      summary: Update a label
      requestBody:
        $ref: '#/components/requestBodies/UpdateLabel'
      responses:
        '200':
          $ref: '#/components/responses/LabelResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Labels]
      summary: Delete a label
      responses:
        '204':
          description: Label deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      summary: List tasks within a project
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskPriorityFilter'
        - name: assignee_id
          in: query
          required: false
          schema:
            type: integer
        - name: label_id
          in: query
          required: false
          schema:
            type: integer
        - name: due_before
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: due_after
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/SearchQuery'
        - name: overdue
          in: query
          required: false
          schema:
            type: boolean
        - name: parent_id
          in: query
          required: false
          schema:
            type: integer
        - name: root
          in: query
          description: When true, only return top-level tasks (no parent).
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [created_at, due_date, priority, position, title]
            default: position
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Tasks]
      summary: Create a task in a project
      requestBody:
        $ref: '#/components/requestBodies/StoreTask'
      responses:
        '201':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{task}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get a task
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      summary: Update a task
      requestBody:
        $ref: '#/components/requestBodies/UpdateTask'
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Tasks]
      summary: Delete a task
      responses:
        '204':
          description: Task deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task}/assign:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Assign a task to a user
      requestBody:
        $ref: '#/components/requestBodies/AssignTask'
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{task}/unassign:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Remove the assignee from a task
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task}/status:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Transition the status of a task
      requestBody:
        $ref: '#/components/requestBodies/TransitionStatus'
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{task}/priority:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Update the priority of a task
      requestBody:
        $ref: '#/components/requestBodies/UpdatePriority'
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{task}/labels:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Sync the labels of a task
      requestBody:
        $ref: '#/components/requestBodies/SyncLabels'
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{task}/subtasks:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: List subtasks of a task
      responses:
        '200':
          description: List of subtasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tasks]
      summary: Create a subtask under a task
      requestBody:
        $ref: '#/components/requestBodies/StoreTask'
      responses:
        '201':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{task}/reorder:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Reorder a task within its list
      requestBody:
        $ref: '#/components/requestBodies/ReorderTask'
      responses:
        '200':
          $ref: '#/components/responses/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{task}/activity:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Activity]
      summary: List activity for a task
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated activity log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      summary: List comments on a task
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: Add a comment to a task
      requestBody:
        $ref: '#/components/requestBodies/StoreComment'
      responses:
        '201':
          $ref: '#/components/responses/CommentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /comments/{comment}:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags: [Comments]
      summary: Update a comment
      requestBody:
        $ref: '#/components/requestBodies/UpdateComment'
      responses:
        '200':
          $ref: '#/components/responses/CommentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Comments]
      summary: Delete a comment
      responses:
        '204':
          description: Comment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{task}/attachments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Attachments]
      summary: List attachments on a task
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of attachments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Attachments]
      summary: Upload an attachment to a task
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreAttachmentRequest'
      responses:
        '201':
          $ref: '#/components/responses/AttachmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /attachments/{attachment}/download:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      summary: Download an attachment
      responses:
        '200':
          description: The attachment file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /attachments/{attachment}:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    delete:
      tags: [Attachments]
      summary: Delete an attachment
      responses:
        '204':
          description: Attachment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the authenticated user
      parameters:
        - name: unread
          in: query
          description: When true, return only unread notifications.
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        '200':
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notification}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      responses:
        '200':
          description: The updated notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/{notification}:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    delete:
      tags: [Notifications]
      summary: Delete a notification
      responses:
        '204':
          description: Notification deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /activity:
    get:
      tags: [Activity]
      summary: List activity visible to the authenticated user
      parameters:
        - name: team_id
          in: query
          required: false
          schema:
            type: integer
        - name: project_id
          in: query
          required: false
          schema:
            type: integer
        - name: causer_id
          in: query
          required: false
          schema:
            type: integer
        - name: action
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated activity log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get the personal dashboard for the authenticated user
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search:
    get:
      tags: [Search]
      summary: Global search across projects, tasks and comments
      parameters:
        - name: q
          in: query
          required: true
          description: Search term (2-255 characters).
          schema:
            type: string
            minLength: 2
            maxLength: 255
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        API token issued by the register/login endpoints. Provide it as
        an Authorization header bearer token.
  parameters:
    PerPage:
      name: per_page
      in: query
      description: Number of items per page (1-100, default 20).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      name: q
      in: query
      description: Free-text search term.
      required: false
      schema:
        type: string
    TaskStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TaskStatus'
    TaskPriorityFilter:
      name: priority
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TaskPriority'
    UserId:
      name: user
      in: path
      required: true
      description: User identifier.
      schema:
        type: integer
    TeamId:
      name: team
      in: path
      required: true
      description: Team identifier.
      schema:
        type: integer
    ProjectId:
      name: project
      in: path
      required: true
      description: Project identifier.
      schema:
        type: integer
    LabelId:
      name: label
      in: path
      required: true
      description: Label identifier.
      schema:
        type: integer
    TaskId:
      name: task
      in: path
      required: true
      description: Task identifier.
      schema:
        type: integer
    CommentId:
      name: comment
      in: path
      required: true
      description: Comment identifier.
      schema:
        type: integer
    AttachmentId:
      name: attachment
      in: path
      required: true
      description: Attachment identifier.
      schema:
        type: integer
    NotificationId:
      name: notification
      in: path
      required: true
      description: Notification identifier.
      schema:
        type: integer
  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    UpdateProfile:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProfileRequest'
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangePasswordRequest'
    UpdateUser:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserRequest'
    StoreTeam:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreTeamRequest'
    UpdateTeam:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateTeamRequest'
    InviteTeamMember:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InviteTeamMemberRequest'
    UpdateTeamMember:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateTeamMemberRequest'
    StoreProject:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreProjectRequest'
    UpdateProject:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProjectRequest'
    StoreProjectMember:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreProjectMemberRequest'
    UpdateProjectMember:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProjectMemberRequest'
    StoreLabel:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreLabelRequest'
    UpdateLabel:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateLabelRequest'
    StoreTask:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreTaskRequest'
    UpdateTask:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateTaskRequest'
    AssignTask:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssignTaskRequest'
    TransitionStatus:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransitionStatusRequest'
    UpdatePriority:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdatePriorityRequest'
    SyncLabels:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SyncLabelsRequest'
    ReorderTask:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReorderTaskRequest'
    StoreComment:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreCommentRequest'
    UpdateComment:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateCommentRequest'
  responses:
    Unauthorized:
      description: Authentication is required or the token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ValidationError:
      description: The submitted data failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    UserResponse:
      description: A single user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserEnvelope'
    TeamResponse:
      description: A single team
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamEnvelope'
    TeamMemberResponse:
      description: A single team member
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamMemberEnvelope'
    ProjectResponse:
      description: A single project
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectEnvelope'
    ProjectMemberResponse:
      description: A single project member
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectMemberEnvelope'
    LabelResponse:
      description: A single label
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LabelEnvelope'
    TaskResponse:
      description: A single task
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskEnvelope'
    CommentResponse:
      description: A single comment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommentEnvelope'
    AttachmentResponse:
      description: A single attachment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttachmentEnvelope'
  schemas:
    TaskStatus:
      type: string
      description: Lifecycle status of a task.
      enum: [todo, in_progress, in_review, done, cancelled]
    TaskPriority:
      type: string
      description: Priority of a task.
      enum: [low, medium, high, urgent]
    TeamRole:
      type: string
      description: Role of a member within a team.
      enum: [owner, admin, member]
    ProjectRole:
      type: string
      description: Role of a member within a project.
      enum: [lead, contributor, viewer]
    PaginationLinks:
      type: object
      description: Laravel pagination links.
      properties:
        first:
          type: [string, "null"]
        last:
          type: [string, "null"]
        prev:
          type: [string, "null"]
        next:
          type: [string, "null"]
    PaginationMeta:
      type: object
      description: Laravel pagination metadata.
      properties:
        current_page:
          type: integer
        from:
          type: [integer, "null"]
        last_page:
          type: integer
        path:
          type: string
        per_page:
          type: integer
        to:
          type: [integer, "null"]
        total:
          type: integer
    MessageResponse:
      type: object
      description: A generic message wrapper used for errors.
      properties:
        message:
          type: string
    ValidationErrorResponse:
      type: object
      description: Laravel validation error response.
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    HealthStatus:
      type: object
      description: Health check payload.
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        app_version:
          type: string
        php_version:
          type: string
        environment:
          type: string
        debug:
          type: boolean
    User:
      type: object
      description: A user account.
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
          description: Only present when viewing your own profile or as an admin.
        role:
          type: string
          enum: [admin, member]
        avatar_url:
          type: [string, "null"]
        timezone:
          type: [string, "null"]
        created_at:
          type: [string, "null"]
          format: date-time
    UserEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    AuthResponse:
      type: object
      description: Authenticated user plus issued API token.
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
    Team:
      type: object
      description: A team that owns projects and members.
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        owner_id:
          type: integer
        owner:
          $ref: '#/components/schemas/User'
        members_count:
          type: integer
        projects_count:
          type: integer
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    TeamEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Team'
    TeamCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    TeamMember:
      type: object
      description: Membership of a user within a team.
      properties:
        id:
          type: integer
        team_id:
          type: [integer, "null"]
        user_id:
          type: [integer, "null"]
        role:
          $ref: '#/components/schemas/TeamRole'
        user:
          $ref: '#/components/schemas/User'
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    TeamMemberEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TeamMember'
    TeamMemberCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
    Project:
      type: object
      description: A project belonging to a team.
      properties:
        id:
          type: integer
        team_id:
          type: integer
        name:
          type: string
        key:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [active, archived]
        color:
          type: [string, "null"]
        created_by:
          type: [integer, "null"]
        team:
          $ref: '#/components/schemas/Team'
        creator:
          $ref: '#/components/schemas/User'
        members_count:
          type: integer
        tasks_count:
          type: integer
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    ProjectEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Project'
    ProjectCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ProjectMember:
      type: object
      description: Membership of a user within a project.
      properties:
        id:
          type: integer
        project_id:
          type: [integer, "null"]
        user_id:
          type: [integer, "null"]
        role:
          $ref: '#/components/schemas/ProjectRole'
        user:
          $ref: '#/components/schemas/User'
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    ProjectMemberEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProjectMember'
    ProjectMemberCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
    ProjectStats:
      type: object
      description: Aggregated statistics for a project.
      properties:
        data:
          type: object
          properties:
            tasks_total:
              type: integer
            tasks_by_status:
              type: object
              additionalProperties:
                type: integer
            tasks_by_priority:
              type: object
              additionalProperties:
                type: integer
            overdue:
              type: integer
            completed:
              type: integer
            completion_pct:
              type: number
              format: float
            members:
              type: integer
    Label:
      type: object
      description: A label that can be attached to tasks within a project.
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        color:
          type: string
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    LabelEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Label'
    LabelCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Label'
    Task:
      type: object
      description: A task with its full detail, including description and labels.
      properties:
        id:
          type: integer
        project_id:
          type: integer
        parent_id:
          type: [integer, "null"]
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignee_id:
          type: [integer, "null"]
        reporter_id:
          type: [integer, "null"]
        assignee:
          $ref: '#/components/schemas/User'
        reporter:
          $ref: '#/components/schemas/User'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        due_date:
          type: [string, "null"]
