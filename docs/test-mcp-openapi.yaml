  /health:
    get:
      tags: [System]
      summary: Service health check
      security: []
      responses:
        '200':
          description: Service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API token issued on register/login. Provide it in the Authorization header
        as a bearer token.
  parameters:
    PerPage:
      name: per_page
      in: query
      description: Items per page (1-100, default 20).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: user
      in: path
      required: true
      description: User identifier.
      schema:
        type: integer
    TeamId:
      name: team
      in: path
      required: true
      description: Team identifier.
      schema:
        type: integer
    ProjectId:
      name: project
      in: path
      required: true
      description: Project identifier.
      schema:
        type: integer
    LabelId:
      name: label
      in: path
      required: true
      description: Label identifier.
      schema:
        type: integer
    TaskId:
      name: task
      in: path
      required: true
      description: Task identifier.
      schema:
        type: integer
    CommentId:
      name: comment
      in: path
      required: true
      description: Comment identifier.
      schema:
        type: integer
    AttachmentId:
      name: attachment
      in: path
      required: true
      description: Attachment identifier.
      schema:
        type: integer
    NotificationId:
      name: notification
      in: path
      required: true
      description: Notification identifier.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Authentication is required or the token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    UserResponse:
      description: A single user resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserEnvelope'
    TeamResponse:
      description: A single team resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamEnvelope'
    TeamMemberResponse:
      description: A single team member resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamMemberEnvelope'
    ProjectResponse:
      description: A single project resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectEnvelope'
    ProjectMemberResponse:
      description: A single project member resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectMemberEnvelope'
    LabelResponse:
      description: A single label resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LabelEnvelope'
    TaskResponse:
      description: A single task resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskEnvelope'
    CommentResponse:
      description: A single comment resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommentEnvelope'
    AttachmentResponse:
      description: A single attachment resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttachmentEnvelope'
  schemas:
    MessageResponse:
      type: object
      description: A simple message payload, typically used for errors.
      properties:
        message:
          type: string
    ValidationErrorResponse:
      type: object
      description: Laravel-style validation error payload.
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PaginationLinks:
      type: object
      description: Pagination navigation links.
      properties:
        first:
          type: [string, "null"]
        last:
          type: [string, "null"]
        prev:
          type: [string, "null"]
        next:
          type: [string, "null"]
    PaginationMeta:
      type: object
      description: Pagination metadata returned by paginated collections.
      properties:
        current_page:
          type: integer
        from:
          type: [integer, "null"]
        last_page:
          type: integer
        path:
          type: string
        per_page:
          type: integer
        to:
          type: [integer, "null"]
        total:
          type: integer
    TaskStatus:
      type: string
      enum: [todo, in_progress, in_review, done, cancelled]
      description: Lifecycle status of a task.
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]
      description: Priority of a task.
    TeamRole:
      type: string
      enum: [owner, admin, member]
      description: Role of a user within a team.
    ProjectRole:
      type: string
      enum: [lead, contributor, viewer]
      description: Role of a user within a project.
    SystemRole:
      type: string
      enum: [admin, member]
      description: Global account role.
    User:
      type: object
      description: A user account. The email is only present when the requester is the user themselves or an admin.
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
          description: Only present to the owner or admins.
        role:
          $ref: '#/components/schemas/SystemRole'
        avatar_url:
          type: [string, "null"]
        timezone:
          type: [string, "null"]
        created_at:
          type: [string, "null"]
          format: date-time
    Team:
      type: object
      description: A team that groups users and projects.
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        owner_id:
          type: integer
        owner:
          $ref: '#/components/schemas/User'
        members_count:
          type: integer
        projects_count:
          type: integer
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    TeamMember:
