      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 255
      required: [name, email, password]
    LoginRequest:
      type: object
      description: Payload for logging in.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
      required: [email, password]
    UpdateProfileRequest:
      type: object
      description: Payload for updating the current user's profile.
      properties:
        name:
          type: string
          maxLength: 255
        avatar_url:
          type: [string, "null"]
          maxLength: 2048
        timezone:
          type: string
          maxLength: 64
    ChangePasswordRequest:
      type: object
      description: Payload for changing the current user's password.
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 255
          description: Must be different from the current password.
      required: [current_password, new_password]
    UpdateUserRequest:
      type: object
      description: Payload for administrators to update a user.
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        role:
          type: string
          enum: [admin, member]
        avatar_url:
          type: [string, "null"]
          maxLength: 2048
        timezone:
          type: string
          maxLength: 64
    StoreTeamRequest:
      type: object
      description: Payload for creating a team.
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          description: Lowercase alphanumeric words separated by hyphens.
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: [string, "null"]
      required: [name, slug]
    UpdateTeamRequest:
      type: object
      description: Payload for updating a team.
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: [string, "null"]
    InviteTeamMemberRequest:
      type: object
      description: Payload for inviting a member to a team.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        role:
          type: string
          enum: [owner, admin, member]
      required: [email, role]
    UpdateTeamMemberRequest:
      type: object
      description: Payload for updating a team member's role.
      properties:
        role:
          type: string
          enum: [owner, admin, member]
      required: [role]
    StoreProjectRequest:
      type: object
      description: Payload for creating a project.
      properties:
        name:
          type: string
          maxLength: 255
        key:
          type: string
          maxLength: 16
          description: Uppercase alphanumeric project key, unique within the team.
          pattern: '^[A-Z0-9]+$'
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [active, archived]
        color:
          type: [string, "null"]
          maxLength: 32
      required: [name, key]
    UpdateProjectRequest:
      type: object
      description: Payload for updating a project.
      properties:
        name:
          type: string
          maxLength: 255
        key:
          type: string
          maxLength: 16
          pattern: '^[A-Z0-9]+$'
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [active, archived]
        color:
          type: [string, "null"]
          maxLength: 32
    StoreProjectMemberRequest:
      type: object
      description: Payload for adding a member to a project.
      properties:
        user_id:
          type: integer
        role:
          type: string
          enum: [lead, contributor, viewer]
      required: [user_id, role]
    UpdateProjectMemberRequest:
      type: object
      description: Payload for updating a project member's role.
      properties:
        role:
          type: string
          enum: [lead, contributor, viewer]
      required: [role]
    StoreLabelRequest:
      type: object
