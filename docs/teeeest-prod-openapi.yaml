      properties:
        name:
          type: string
          maxLength: 64
        color:
          type: string
          maxLength: 32
          description: Hex color, optionally prefixed with a hash.
          pattern: '^#?[0-9a-fA-F]{3,8}$'
      required: [name, color]
    UpdateLabelRequest:
      type: object
      description: Payload for updating a label.
      properties:
